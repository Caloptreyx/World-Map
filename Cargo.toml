[package]
name = "dev_caloptreyx_worldmap"
description = "A top-down map of Minecraft Java worlds read from the server files: players, mobs and entities, a player heatmap, chunk deletion and teleports."
authors = ["Caloptreyx"]
version = "0.1.0"
edition = { workspace = true }

[dependencies]
shared = { workspace = true }
wings-api = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
compact_str = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
flate2 = "1.1"
# Minecraft's region compression type 4 (lz4-java block streams), decoding only
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-decode", "checked-decode"] }
png = "0.18"
